<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bike Rental</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bike Rental</h1>
    <nav>
      <a href="#dashboard">Dashboard</a>
      <a href="#bikes">Bikes</a>
      <a href="#persons">Persons</a>
      <a href="#reservations">Reservations</a>
    </nav>
    <span id="api-status" class="status">API: checking…</span>
  </header>

  <main>
    <section id="dashboard" class="page">
      <h2>Dashboard</h2>
      <p>Overview of the shop – coming in Phase 4.</p>
    </section>

    <section id="bikes" class="page">
      <h2>Bikes</h2>

      <form id="bike-form" class="card" autocomplete="off">
        <h3 id="bike-form-title">New bike</h3>
        <input type="hidden" name="id">
        <div class="fields">
          <label>Name
            <input name="name" required maxlength="100" placeholder="e.g. City-01">
          </label>
          <label>Category
            <select name="category" required></select>
          </label>
          <label>Status
            <select name="status">
              <option value="available">Available</option>
              <option value="maintenance">Maintenance</option>
              <option value="retired">Retired</option>
            </select>
          </label>
          <label class="wide">Description
            <input name="description" maxlength="500" placeholder="Color, brand, notes (optional)">
          </label>
        </div>
        <p id="bike-form-error" class="error" role="alert"></p>
        <div class="buttons">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="bike-cancel" hidden>Cancel</button>
        </div>
      </form>

      <div class="toolbar">
        <label><input type="checkbox" id="show-retired"> Show retired bikes</label>
      </div>
      <p id="bike-list-error" class="error" role="alert"></p>
      <table>
        <thead>
          <tr><th>Name</th><th>Category</th><th>Price / h</th><th>Status</th><th>Description</th><th></th></tr>
        </thead>
        <tbody id="bike-rows"></tbody>
      </table>
    </section>

    <section id="persons" class="page">
      <h2>Persons</h2>

      <form id="person-form" class="card" autocomplete="off">
        <h3 id="person-form-title">New person</h3>
        <input type="hidden" name="id">
        <div class="fields">
          <label>First name
            <input name="firstName" required maxlength="100">
          </label>
          <label>Last name
            <input name="lastName" required maxlength="100">
          </label>
          <label>ID number
            <input name="idNumber" required maxlength="30" placeholder="e.g. L01X00T47">
          </label>
          <label>Phone
            <input name="phone" type="tel" required maxlength="30" placeholder="e.g. +49 170 1234567">
          </label>
          <label id="person-file-label" class="wide">ID copy (PDF, JPG or PNG, max. 5 MB)
            <input name="idDocument" type="file" required accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png">
          </label>
        </div>
        <p id="person-form-error" class="error" role="alert"></p>
        <div class="buttons">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="person-cancel" hidden>Cancel</button>
        </div>
      </form>

      <div class="toolbar">
        <input type="search" id="person-search" placeholder="Search name, ID number or phone" aria-label="Search persons">
        <label><input type="checkbox" id="show-archived"> Show archived persons</label>
      </div>
      <p id="person-list-error" class="error" role="alert"></p>
      <table>
        <thead>
          <tr><th>Name</th><th>ID number</th><th>Phone</th><th>ID copy</th><th></th></tr>
        </thead>
        <tbody id="person-rows"></tbody>
      </table>
      <input type="file" id="person-replace-file" hidden accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png">
    </section>

    <section id="reservations" class="page">
      <h2>Reservations</h2>
      <p>Reservation management – coming in Phase 3.</p>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="app.js"></script>
  <script src="bikes.js"></script>
  <script src="persons.js"></script>
</body>
</html>
