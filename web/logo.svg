<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Power Bike logo: pink bicycle with a woman with a ponytail">
  <title>Power Bike</title>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- wheels -->
    <circle cx="14" cy="46" r="10.5" stroke="#e91e63" stroke-width="3.5"/>
    <circle cx="50" cy="46" r="10.5" stroke="#e91e63" stroke-width="3.5"/>
    <circle cx="14" cy="46" r="2" fill="#e91e63" stroke="none"/>
    <circle cx="50" cy="46" r="2" fill="#e91e63" stroke="none"/>
    <!-- frame: rear hub, crank, head tube, seat; fork; seat post; handlebar -->
    <path d="M14 46 L30 46 L44 31 L26 31 Z" stroke="#e91e63" stroke-width="3.5"/>
    <path d="M30 46 L24 26" stroke="#e91e63" stroke-width="3.5"/>
