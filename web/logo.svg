    <path d="M30.5 8 C25.5 6.5 21.5 9.5 21 13.5 C20.6 16.5 19.5 18.5 17 19.5" stroke="#ad1457" stroke-width="3.4"/>
    <circle cx="30.4" cy="8.1" r="1.7" fill="#f8bbd0" stroke="none"/>
    <circle cx="35" cy="10" r="5" fill="#ad1457" stroke="none"/>
    <path d="M25 24 L33 15.5" stroke="#ad1457" stroke-width="4.5"/>
    <path d="M33 16.5 L42 24" stroke="#ad1457" stroke-width="3"/>
    <path d="M25 24 L34 33 L31 44" stroke="#ad1457" stroke-width="3.5"/>
    <path d="M28.5 44 L33.5 44" stroke="#ad1457" stroke-width="3"/>
  </g>
</svg>
